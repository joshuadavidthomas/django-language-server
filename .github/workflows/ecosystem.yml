name: ecosystem

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/actions/setup/action.yml
      - .github/workflows/ecosystem.yml
      - crates/**
      - tools/ecosystem.py
      - Justfile
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
  workflow_dispatch:

concurrency:
  group: ecosystem-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONUNBUFFERED: "1"

permissions: {}

jobs:
  diff:
    name: Diagnostics diff across the corpus
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No Rust cache: this workflow runs only on pull requests, which never save caches, and
      # no job on main builds the release profile it needs.
      - uses: $/.github/actions/setup
        with:
          tools: rust uv just
          corpus: true

      - name: Sync corpus
        run: just corpus sync --source-only

      - name: Diff diagnostics between base and head
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: just ecosystem "$BASE_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ecosystem
          path: target/ecosystem/*.json
          if-no-files-found: warn
