name: ecosystem

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/actions/setup/action.yml
      - .github/workflows/ecosystem.yml
      - crates/**
      - tools/ecosystem.py
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
  workflow_dispatch:

concurrency:
  group: ecosystem-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONUNBUFFERED: "1"

permissions: {}

jobs:
  diff:
    name: Diagnostics diff across the corpus
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No Rust cache: this workflow runs only on pull requests, which never save caches, and
      # no job on main builds the release profile it needs.
      - uses: $/.github/actions/setup
        with:
          tools: rust uv
          corpus: true

      - name: Sync corpus
        run: cargo run -q -p djls-testing --bin corpus -- sync --source-only

      - name: Build head
        run: |
          cargo build --release -q -p djls
          mkdir -p "$RUNNER_TEMP/ecosystem"
          cp target/release/djls "$RUNNER_TEMP/ecosystem/djls-head"

      - name: Build base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          cargo build --release -q -p djls --manifest-path "$RUNNER_TEMP/base/Cargo.toml" --target-dir target
          cp target/release/djls "$RUNNER_TEMP/ecosystem/djls-base"

      - name: Run base and head
        run: |
          uv run tools/ecosystem.py run --djls "$RUNNER_TEMP/ecosystem/djls-base" --output "$RUNNER_TEMP/ecosystem/base.json"
          uv run tools/ecosystem.py run --djls "$RUNNER_TEMP/ecosystem/djls-head" --output "$RUNNER_TEMP/ecosystem/head.json"

      - name: Diff
        run: uv run tools/ecosystem.py diff "$RUNNER_TEMP/ecosystem/base.json" "$RUNNER_TEMP/ecosystem/head.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ecosystem
          path: ${{ runner.temp }}/ecosystem/*.json
          if-no-files-found: warn
