name: ecosystem

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ecosystem.yml
      - crates/**
      - tools/ecosystem.py
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
  workflow_dispatch:

concurrency:
  group: ecosystem-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONUNBUFFERED: "1"

permissions: {}

jobs:
  diff:
    name: Diagnostics diff across the corpus
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: rust uv

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/djls-testing/.corpus/repos
          key: ${{ runner.os }}-corpus-source-${{ hashFiles('crates/djls-testing/manifest.lock') }}
          restore-keys: |
            ${{ runner.os }}-corpus-source-

      - name: Sync corpus
        run: cargo run -q -p djls-testing --bin corpus -- sync --source-only

      - name: Build head
        run: |
          cargo build --release -q -p djls
          mkdir -p "$RUNNER_TEMP/ecosystem"
          cp target/release/djls "$RUNNER_TEMP/ecosystem/djls-head"

      - name: Build base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          cargo build --release -q -p djls --manifest-path "$RUNNER_TEMP/base/Cargo.toml" --target-dir target
          cp target/release/djls "$RUNNER_TEMP/ecosystem/djls-base"

      - name: Run base and head
        run: |
          uv run tools/ecosystem.py run --djls "$RUNNER_TEMP/ecosystem/djls-base" --output "$RUNNER_TEMP/ecosystem/base.json"
          uv run tools/ecosystem.py run --djls "$RUNNER_TEMP/ecosystem/djls-head" --output "$RUNNER_TEMP/ecosystem/head.json"

      - name: Diff
        run: uv run tools/ecosystem.py diff "$RUNNER_TEMP/ecosystem/base.json" "$RUNNER_TEMP/ecosystem/head.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ecosystem
          path: ${{ runner.temp }}/ecosystem/*.json
          if-no-files-found: warn
