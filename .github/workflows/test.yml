name: test

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/test.yml
      - crates/**
      - tests/**
      - Cargo.lock
      - Cargo.toml
      - pyproject.toml
      - noxfile.py
      - mise.toml
      - rust-toolchain.toml
      - uv.lock
  push:
    branches:
      - main
    paths:
      - .github/workflows/test.yml
      - crates/**
      - tests/**
      - Cargo.lock
      - Cargo.toml
      - pyproject.toml
      - noxfile.py
      - mise.toml
      - rust-toolchain.toml
      - uv.lock
  workflow_call:
    inputs:
      os:
        description: Comma-delineated list of OS targets to run tests on
        required: false
        type: string
  workflow_dispatch:
    inputs:
      os:
        description: Comma-delineated list of OS targets to run tests on
        required: false
        type: string

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_COLOR: "1"
  PYTHONUNBUFFERED: "1"
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv

permissions: {}

jobs:
  should-run:
    if: "${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || !contains(github.event.head_commit.message, ':bookmark: bump version') }}"
    runs-on: ubuntu-latest
    steps:
      - run: true

  generate-matrix:
    needs: [should-run]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          add_shims_to_path: false
          install_args: uv

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-uv-matrix-${{ hashFiles('uv.lock', 'mise.toml', 'noxfile.py') }}

      - name: Determine OS targets
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" == release/* ]]; then
            echo "OS=macos-latest,ubuntu-latest,windows-latest" >> $GITHUB_ENV
          fi

      - id: set-matrix
        env:
          OS: ${{ inputs.os }}
        run: |
          uv run --no-project --with "nox[uv]" nox --session gha_matrix -- "${OS}"

  test:
    name: Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/djls-testing/.corpus
          key: ${{ runner.os }}-corpus-${{ hashFiles('crates/djls-testing/manifest.lock') }}
          restore-keys: |
            ${{ runner.os }}-corpus-

      - name: Install uv
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          add_shims_to_path: false
          install_args: uv rust

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-uv-test-${{ matrix.python-version }}-${{ matrix.django-version }}-${{ hashFiles('uv.lock', 'mise.toml', 'noxfile.py') }}

      - name: Run tests
        shell: bash
        env:
          DJANGO_VERSION: ${{ matrix.django-version }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv run --no-project --with "nox[uv]" nox --session "tests(python='${PYTHON_VERSION}', django='${DJANGO_VERSION}')"

  vendored-spec-fixtures:
    runs-on: ubuntu-latest
    needs: should-run
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: rust

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Cache corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/djls-testing/.corpus
          key: ${{ runner.os }}-corpus-${{ hashFiles('crates/djls-testing/manifest.lock') }}
          restore-keys: |
            ${{ runner.os }}-corpus-

      - name: Sync corpus
        run: cargo run -q -p djls-testing --bin corpus -- sync

      - name: Check vendored spec fixtures
        run: cargo run -q -p djls-testing --bin corpus -- vendor-spec-fixtures --check

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          add_shims_to_path: false
          install_args: uv rust

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-uv-e2e-${{ hashFiles('uv.lock', 'mise.toml', 'noxfile.py') }}

      - name: Run e2e tests
        shell: bash
        run: |
          uv run --no-project --with "nox[uv]" nox --session e2e

  tests:
    runs-on: ubuntu-latest
    needs: [test, vendored-spec-fixtures, e2e]
    if: always()
    steps:
      - name: OK
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Fail
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
