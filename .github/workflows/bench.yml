name: bench

on:
  pull_request:
    paths:
      - ".github/workflows/bench.yml"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "mise.toml"
      - "rust-toolchain.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/bench.yml"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "mise.toml"
      - "rust-toolchain.toml"
  workflow_dispatch:

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          add_shims_to_path: false
          install_args: rust uv

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Cache corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/djls-testing/.corpus/repos
          key: ${{ runner.os }}-corpus-source-${{ hashFiles('crates/djls-testing/manifest.lock') }}
          restore-keys: |
            ${{ runner.os }}-corpus-source-

      - name: Sync corpus
        run: cargo run -q -p djls-testing --bin corpus -- sync --source-only

      # Real-project benchmarks need these two environments. Restore, but never save, the
      # Project-backed corpus job's uv cache so this job cannot replace it with a subset.
      - name: Restore corpus Python downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-uv-corpus-${{ hashFiles('crates/djls-testing/manifest.lock', 'crates/djls-testing/manifest.toml', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-uv-corpus-

      - name: Build real-project environments
        run: |
          # netbox builds psycopg-c from source when the uv cache has no wheel for it.
          command -v pg_config >/dev/null || { sudo apt-get update && sudo apt-get install -y libpq-dev; }
          cargo run -q -p djls-testing --bin corpus -- environment sync djangoproject.com netbox

      - name: Verify benchmark workload snapshots
        run: DJLS_REQUIRE_BENCH_CORPUS=1 cargo test -p djls-bench -- --include-ignored

      - run: cargo install cargo-codspeed --locked

      - name: Build the benchmark target(s)
        run: cargo codspeed build -p djls-bench

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062
        env:
          # Use the same glibc memcmp path on Intel and AMD simulation runners.
          # https://codspeed.io/blog/why-glibc-faster-github-actions
          GLIBC_TUNABLES: glibc.cpu.hwcaps=-AVX2
        with:
          mode: simulation
          run: cargo codspeed run -p djls-bench
