name: bench

on:
  pull_request:
    # `labeled` lets adding the `bench 🏋️` label start a run with the real-project shard.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - ".github/actions/setup/action.yml"
      - ".github/workflows/bench.yml"
      - "crates/**"
      - "Cargo.lock"
      - "Justfile"
      - "Cargo.toml"
      - "mise.toml"
      - "rust-toolchain.toml"
  push:
    branches: [main]
    paths:
      - ".github/actions/setup/action.yml"
      - ".github/workflows/bench.yml"
      - "crates/**"
      - "Cargo.lock"
      - "Justfile"
      - "Cargo.toml"
      - "mise.toml"
      - "rust-toolchain.toml"
  workflow_dispatch:

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv

# The benchmarks run in shards split by setup cost. CodSpeed merges the shards' results
# because they run in this one workflow; keep them here.
# https://codspeed.io/docs/features/sharded-benchmarks
#
# - core: benchmarks on in-repo fixtures. The corpus is absent, so the corpus-backed
#   benchmarks in the same files skip themselves.
# - corpus: corpus-backed benchmarks, selected by the `corpus` name filter. A new
#   corpus-backed benchmark needs `corpus` in its name to run here.
# - real-project: the `real_project` bench target on two corpus Python environments. It runs on
#   main, on manual runs, and on PRs labeled `bench 🏋️`.
#
# A PR labeled with anything else does not rerun the benchmarks.
jobs:
  benchmarks:
    name: benchmarks (${{ matrix.shard }}, ${{ matrix.mode }})
    if: github.event.action != 'labeled' || github.event.label.name == 'bench 🏋️'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [core, corpus]
        mode: [simulation, memory]
        include:
          - shard: core
            benches: --bench parser --bench semantic --bench diagnostics --bench extraction --bench check --bench models
            filter: ""
            run_env: ""
          - shard: corpus
            benches: --bench extraction --bench check --bench models
            filter: corpus
            # Fail rather than skip when the corpus is missing.
            run_env: DJLS_REQUIRE_BENCH_CORPUS=1
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every shard of one mode builds the same dependencies. The corpus shard also builds
      # the corpus binary, so it saves the mode's cache.
      - uses: $/.github/actions/setup
        with:
          tools: rust just
          save: ${{ matrix.shard == 'corpus' }}
          rust-cache: bench-${{ matrix.mode }}
          corpus: ${{ matrix.shard == 'corpus' }}

      - run: df -h /

      - name: Sync corpus
        if: matrix.shard == 'corpus'
        run: just corpus sync --source-only

      - run: cargo install cargo-codspeed --locked

      - name: Build the benchmark target(s)
        run: |
          just bench-build ${{ matrix.mode }} ${{ matrix.benches }}
          df -h /

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        env:
          # Use the same glibc memcmp path on Intel and AMD simulation runners.
          # https://codspeed.io/blog/why-glibc-faster-github-actions
          GLIBC_TUNABLES: glibc.cpu.hwcaps=-AVX2
        with:
          mode: ${{ matrix.mode }}
          # check.rs::corpus_all skips itself in memory mode; see codspeed_memory_mode.
          run: ${{ matrix.run_env }} cargo codspeed run -m ${{ matrix.mode }} -p djls-bench ${{ matrix.benches }} ${{ matrix.filter }}

  real-project:
    name: benchmarks (real-project, simulation)
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'bench 🏋️')
      && (github.event.action != 'labeled' || github.event.label.name == 'bench 🏋️'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          tools: rust uv just
          save: false
          rust-cache: bench-simulation
          corpus: true

      # Restore, but never save, the Project-backed corpus job's uv cache so this job
      # cannot replace it with a subset.
      - name: Restore corpus Python downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-uv-corpus-${{ hashFiles('crates/djls-testing/manifest.lock', 'crates/djls-testing/manifest.toml', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-uv-corpus-

      - run: df -h /

      - name: Sync corpus
        run: just corpus sync --source-only

      - name: Build real-project environments
        run: |
          # netbox builds psycopg-c from source when the uv cache has no wheel for it.
          command -v pg_config >/dev/null || { sudo apt-get update && sudo apt-get install -y libpq-dev; }
          just corpus environment sync djangoproject.com netbox
          uv cache prune --ci
          df -h /

      - run: cargo install cargo-codspeed --locked

      - name: Build the benchmark target
        run: |
          just bench-build simulation --bench real_project
          df -h /

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        env:
          # Use the same glibc memcmp path on Intel and AMD simulation runners.
          # https://codspeed.io/blog/why-glibc-faster-github-actions
          GLIBC_TUNABLES: glibc.cpu.hwcaps=-AVX2
          DJLS_REQUIRE_BENCH_CORPUS: "1"
        with:
          mode: simulation
          run: cargo codspeed run -m simulation -p djls-bench --bench real_project
