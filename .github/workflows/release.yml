name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      recover_tag:
        description: "Existing release tag to recover (dispatch from main)"
        type: string
        default: ""
      artifacts_run_id:
        description: "Completed release run whose original artifacts should be reused"
        type: string
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  preflight:
    if: inputs.recover_tag == '' && inputs.artifacts_run_id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Install uv
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          add_shims_to_path: false
          cache: false
          install_args: uv

      - name: Verify release commit is on main
        run: uv run tools/release.py preflight "$RELEASE_TAG" "$GITHUB_SHA"

      - name: Verify release metadata
        run: uv run tools/release.py check --release "$RELEASE_TAG"

  lint:
    uses: $/.github/workflows/lint.yml
    needs: preflight
    permissions:
      contents: read
    with:
      ref: ${{ github.ref }}

  test:
    uses: $/.github/workflows/test.yml
    needs: preflight
    permissions:
      contents: read
    with:
      ref: ${{ github.ref }}

  build:
    uses: $/.github/workflows/build.yml
    needs: [lint, test]
    permissions:
      attestations: write
      contents: read
      id-token: write
    with:
      ref: ${{ github.ref }}
      version: ${{ github.ref_name }}

  release:
    runs-on: ubuntu-latest
    needs: build
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Install uv
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          add_shims_to_path: false
          cache: false
          install_args: uv

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Verify binary checksums
        run: uv run tools/release.py verify-binaries

      - name: Create draft GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run tools/release.py github-draft "$RELEASE_TAG"

      - name: Upload GitHub release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run tools/release.py github-assets "$RELEASE_TAG"

      - name: Publish to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*

      - name: Verify PyPI artifacts
        run: uv run tools/release.py verify-pypi "$RELEASE_TAG"

      - name: Smoke-test PyPI installation
        run: uv run tools/release.py smoke-pypi "$RELEASE_TAG"

      - name: Smoke-test standalone download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run tools/release.py smoke-standalone "$RELEASE_TAG"

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run tools/release.py github-publish "$RELEASE_TAG"

  recover:
    if: github.event_name == 'workflow_dispatch' && (inputs.recover_tag != '' || inputs.artifacts_run_id != '')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      attestations: read
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.recover_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .release-tools

      - name: Install uv
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          add_shims_to_path: false
          cache: false
          install_args: uv

      - name: Validate original release run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS_RUN_ID: ${{ inputs.artifacts_run_id }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test -n "$RELEASE_TAG"
          test -n "$ARTIFACTS_RUN_ID"
          cp .release-tools/tools/release.py tools/release.py
          uv run tools/release.py recovery-preflight "$RELEASE_TAG" "$ARTIFACTS_RUN_ID"
          uv run tools/release.py check --release "$RELEASE_TAG"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.artifacts_run_id }}

      - name: Verify binary checksums
        run: uv run tools/release.py verify-binaries

      - name: Verify original artifact provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run tools/release.py verify-provenance "$RELEASE_TAG"

      - name: Create draft GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run tools/release.py github-draft "$RELEASE_TAG"

      - name: Upload GitHub release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run tools/release.py github-assets "$RELEASE_TAG"

      - name: Publish to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*

      - name: Verify PyPI artifacts
        run: uv run tools/release.py verify-pypi "$RELEASE_TAG"

      - name: Smoke-test PyPI installation
        run: uv run tools/release.py smoke-pypi "$RELEASE_TAG"

      - name: Smoke-test standalone download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run tools/release.py smoke-standalone "$RELEASE_TAG"

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run tools/release.py github-publish "$RELEASE_TAG"
