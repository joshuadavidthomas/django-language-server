name: deep-tests

# Property tests run with a fixed seed on every PR. This runs them with a fresh seed and many
# more cases to find new failures. Reproduce one locally with the logged PROPTEST_RNG_SEED and
# PROPTEST_CASES, then turn the shrunk input into a fixed regression test.
#
# The fuzz job runs the template parser fuzzer for 10 minutes, seeded from corpus templates.
# A crash uploads its input as the fuzz-crashes artifact; reproduce it with
# `cargo +<nightly> fuzz run --fuzz-dir fuzz parse_template <input>`.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PROPTEST_RNG_SEED: ${{ github.run_id }}

permissions: {}

jobs:
  django-facts:
    name: Live Django exploration (${{ matrix.shard }})
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [fixtures, blocks, helpers, nightly]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          tools: uv rust just
          save: false
          rust-cache: test
          corpus: true

      - name: Install historical interpreter build dependencies
        if: matrix.shard == 'nightly'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev libffi-dev liblzma-dev libpq-dev libcurl4-openssl-dev

      - name: Restore historical interpreters
        if: matrix.shard == 'nightly'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/djls-testing/.corpus/interpreters
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu22-corpus-python-${{ hashFiles('tools/corpus-python.sh') }}

      - name: Collect live Django subjects with pytest
        env:
          SHARD: ${{ matrix.shard }}
        run: just django-facts -m "facts_$SHARD" --facts-required-shard "$SHARD" --facts-output "target/oracle/$SHARD" --junitxml "target/oracle/$SHARD/junit.xml"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: django-facts-${{ matrix.shard }}
          path: target/oracle/${{ matrix.shard }}/
          if-no-files-found: error

  properties:
    name: Property tests with a fresh seed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds the test profile like the test matrix, so it restores that cache.
      - uses: $/.github/actions/setup
        with:
          tools: rust just
          save: false
          rust-cache: test

      - name: Property tests with many cases
        run: just deep-properties

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: proptest-regressions
          path: crates/*/proptest-regressions/
          if-no-files-found: ignore

  fuzz:
    name: Template parser fuzzer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          tools: just rust
          rust-cache: fuzz
          rust-cache-workspaces: |
            .
            fuzz
          corpus: true

      - name: Install cargo-fuzz and the nightly toolchain
        run: |
          cargo install cargo-fuzz --locked
          rustup toolchain install "$(sed -n 's/^channel = "\([^"]*\)"/\1/p' tools/rustfmt/rust-toolchain.toml)" --profile minimal

      - name: Sync corpus source
        run: just corpus sync --source-only

      - name: Fuzz the template parser
        run: just fuzz -max_total_time=600

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore
