name: deep-tests

# Property tests run with a fixed seed on every PR. This runs them with a fresh seed and many
# more cases to find new failures. Reproduce one locally with the logged PROPTEST_RNG_SEED and
# PROPTEST_CASES, then turn the shrunk input into a fixed regression test.
#
# The fuzz job runs the template parser fuzzer for 10 minutes, seeded from corpus templates.
# A crash uploads its input as the fuzz-crashes artifact; reproduce it with
# `cargo +<nightly> fuzz run --fuzz-dir fuzz parse_template <input>`.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PROPTEST_RNG_SEED: ${{ github.run_id }}

permissions: {}

jobs:
  properties:
    name: Property tests with a fresh seed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds the test profile like the test matrix, so it restores that cache.
      - uses: $/.github/actions/setup
        with:
          tools: rust
          save: false
          rust-cache: test

      - name: Static Python evaluator against CPython
        if: ${{ !cancelled() }}
        env:
          PROPTEST_CASES: "5000"
        run: cargo test -p djls-project --lib cpython_differential

      - name: Incremental diagnostics against a fresh database
        if: ${{ !cancelled() }}
        env:
          PROPTEST_CASES: "500"
        run: cargo test -p djls-ide --test it incremental

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: proptest-regressions
          path: crates/*/proptest-regressions/
          if-no-files-found: ignore

  fuzz:
    name: Template parser fuzzer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          tools: just rust
          rust-cache: fuzz
          rust-cache-workspaces: |
            .
            fuzz
          corpus: true

      - name: Install cargo-fuzz and the nightly toolchain
        run: |
          cargo install cargo-fuzz --locked
          rustup toolchain install "$(sed -n 's/^channel = "\([^"]*\)"/\1/p' tools/rustfmt/rust-toolchain.toml)" --profile minimal

      - name: Sync corpus source
        run: just corpus sync --source-only

      - name: Fuzz the template parser
        run: just fuzz -max_total_time=600

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore
