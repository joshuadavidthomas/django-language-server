[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
cargo-insta = "1.48"
# Keep paired with tools/hawk/rust-toolchain.toml.
"github:astral-sh/hawk" = { version = "0.1.14", os = ["linux", "macos"] }
just = "1"
prek = "0.5"
uv = "0.12"
# Keep paired with the wasm-bindgen crate in Cargo.lock; it generates the djls-wasm JS bindings.
"github:wasm-bindgen/wasm-bindgen" = "0.2.104"
zizmor = "1"
