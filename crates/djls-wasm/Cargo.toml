[package]
name = "djls-wasm"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Django sources are registered at runtime (`registerDjango`) unless a release is embedded.
bundled-django = ["djls-project/bundled-django"]
django-5-2 = ["djls-project/django-5-2"]

[dependencies]
djls-conf = { workspace = true }
djls-db = { workspace = true }
djls-ide = { workspace = true }
djls-lsp = { workspace = true }
djls-project = { workspace = true }
djls-source = { workspace = true }

camino = { workspace = true }
percent-encoding = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower-lsp-server = { workspace = true }
wasm-bindgen = "0.2"

[lints]
workspace = true
