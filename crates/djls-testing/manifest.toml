ref = "4.0.3"
# The default py311-django50 tox environment, not a corpus-selected Django.
environment = { python = "3.11", dependencies = { kind = "requirements", inputs = ["setup.py", "requirements/requirements-testing.txt"], supplemental = ["Django>=5.0,<5.1", "coverage"] } }

[[repo]]
