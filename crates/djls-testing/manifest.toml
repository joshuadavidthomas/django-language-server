ref = "4.1"
environment = { source_roots = ["src", "."], dependencies = { kind = "requirements", inputs = ["pyproject.toml"] } }

[[repo]]
name = "django-permission"
url = "https://github.com/lambdalisue/django-permission.git"
ref = "v1.0.3"
# Historical upstream tox profile; interpreter availability is intentionally not modernized.
# app-version's published wheel contains stale 0.2.1 egg metadata beside 1.0.1;
# building the same release from source produces consistent metadata.
environment = { python = "3.6", source_roots = ["src", "."], dependencies = { kind = "requirements", inputs = ["setup.py", "requirements.txt"], supplemental = ["Django>=1.11,<2.0"], no_binary = ["app-version"] } }

[[repo]]
name = "django-pipeline"
url = "https://github.com/jazzband/django-pipeline.git"
ref = "4.1.0"
# tox.ini's py312-dj52 environment; package metadata only installs build tools.
environment = { dependencies = { kind = "requirements", inputs = ["pyproject.toml"], supplemental = ["Django>=5.2,<5.3", "jinja2", "coverage", "jsmin==3.0.0", "ply==3.4", "css-html-js-minify==2.5.5"] } }

[[repo]]
