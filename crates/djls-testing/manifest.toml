[corpus]
root_dir = ".corpus"

[[repo]]
name = "archivebox"
url = "https://github.com/ArchiveBox/ArchiveBox.git"
ref = "dev"
django_settings_module = "archivebox.core.settings"
environment = { python = "3.13", dependencies = { kind = "uv_lock" } }

[[repo]]
name = "babybuddy"
url = "https://github.com/babybuddy/babybuddy.git"
ref = "master"
environment = { dependencies = { kind = "requirements", inputs = ["requirements.txt"] } }

